name: r6-ops-board

services:
  r6-notifier:
    build: .
    container_name: r6-ops-board
    restart: unless-stopped
    command: python main.py
    env_file: .env
    volumes:
      - ./data:/data

  r6-site:
    build: .
    container_name: r6-ops-board-site
    restart: unless-stopped
    command: python webgen.py
    env_file: .env
    volumes:
      - ./site-repo:/repo
